<div class="app-main-container d-flex justify-content-between align-items-center py-5 rounded-5">
    <app-musiclist (_changeViewMode)="switchViewMode($event)"></app-musiclist>
    @if (viewMode() === 'Player') {
        <app-player></app-player>
    } @else if(viewMode() === 'AddForm') {
        <app-addform></app-addform>
    } @else {
        <img class="main-logo rounded-5" src="images/spotidaw_logo.png" alt="SpotiDAW Logo">
    }
</div>
