<div class="app-main-container d-flex justify-content-between align-items-center py-3 rounded-5">
    <app-musiclist [_actualViewMode]="viewMode()" [_newSongToAdd]="songToAddOnMusicList()" [_saveLocalStorage]="shoudSaveLocalStorage()" (_changeViewMode)="switchViewMode($event)" (_songToPlay)="giveSongToPlayer($event)"></app-musiclist>
    
    @if (viewMode() === 'Player') {
        <app-player [_songRecived]="songToPlayOnPlayer()" (_adviceToSaveLocalStorage)="onSaveLocalStorage()" (_changeViewMode)="switchViewMode($event)"></app-player>

    } @else if(viewMode() === 'AddForm') {
        <app-addform (_changeViewMode)="switchViewMode($event)" (_songToSend)="handleNewSong($event)"></app-addform>

    } @else {
        <img class="main-logo rounded-5" src="images/spotidaw_logo.png" alt="SpotiDAW Logo">
    }
</div>
